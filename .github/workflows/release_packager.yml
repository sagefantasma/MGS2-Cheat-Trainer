name: Auto Release from v2_releases Folder
on:
  push:
    branches:
      - main
permissions:
  contents: write  # Needed for creating releases and uploading assets
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh
      - name: Get highest version from folder names
        id: get-version
        run: |
          echo "Scanning folder versions..."
          cd "v2_releases"
          VERSIONS=$(find . -maxdepth 1 -mindepth 1 -type d | sed 's|./||' | grep -oE '[0-9]+(_[0-9]+)*$' | sed 's/_/./g')
          if [ -z "$VERSIONS" ]; then
            echo "No version folders found."
            exit 0
          fi
          HIGHEST_VERSION=$(echo "$VERSIONS" | sort -V | tail -n 1)
          echo "Highest version found: $HIGHEST_VERSION"
          echo "version=$HIGHEST_VERSION" >> $GITHUB_OUTPUT
      - name: Check if release exists for highest version
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          echo "Checking GitHub releases for version: $VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "✅ A release with tag v$VERSION already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No release with tag v$VERSION found."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Stop if release already exists
        if: steps.check-release.outputs.exists == 'true'
        run: |
          echo "Release already exists for version ${{ steps.get-version.outputs.version }}. Stopping workflow."
          exit 0
      - name: Rename files (strip .deploy) and create archives per platform
        if: steps.check-release.outputs.exists == 'false'
        id: archive
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          WORK_DIR="v2_releases"
          TARGET_FOLDER=$(find "$WORK_DIR" -maxdepth 1 -type d -name "*${VERSION//./_}" | head -n 1)
          echo "Target folder: $TARGET_FOLDER"
          if [ -z "$TARGET_FOLDER" ]; then
            echo "❌ Could not find folder for version $VERSION"
            exit 1
          fi

          sudo apt-get update && sudo apt-get install -y p7zip-full

          ARCHIVE_PATHS=""
          for RID in win-x64 linux-x64; do
            RID_FOLDER="$TARGET_FOLDER/$RID"
            if [ ! -d "$RID_FOLDER" ]; then
              echo "⚠️ No folder found for $RID ($RID_FOLDER), skipping."
              continue
            fi

            # Strip .deploy from files in this platform's folder
            find "$RID_FOLDER" -type f -name "*.deploy" | while read FILE; do
              NEW_FILE=$(echo "$FILE" | sed 's/\.deploy$//')
              mv "$FILE" "$NEW_FILE"
            done

            ARCHIVE_NAME="MGS2_CheatTrainer_${VERSION}_${RID}.7z"
            7z a "$ARCHIVE_NAME" "$RID_FOLDER"/*
            ARCHIVE_PATHS="$ARCHIVE_PATHS $ARCHIVE_NAME"
          done

          if [ -z "$ARCHIVE_PATHS" ]; then
            echo "❌ No platform folders found to archive."
            exit 1
          fi

          echo "archive_paths=$ARCHIVE_PATHS" >> $GITHUB_OUTPUT
      - name: Create GitHub Release and upload archives
        if: steps.check-release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          RELEASE_NAME="MGS2 Cheat Trainer v$VERSION"
          echo "Creating GitHub release: $RELEASE_NAME"
          gh release create "v$VERSION" ${{ steps.archive.outputs.archive_paths }} \
            --title "$RELEASE_NAME" \
            --notes "Automatic release for version $VERSION."
